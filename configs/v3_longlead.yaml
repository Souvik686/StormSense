project:
  name: sih-severe-weather-nowcast
  seed: 42
paths:
  data_root: Data
  processed_root: processed
  outputs_root: outputs
  reports_root: reports
  cache_root: processed/cache
domain:
  lat_min: 20.0
  lat_max: 28.0
  lon_min: 84.0
  lon_max: 90.0
  resolution_deg: 0.25
  grid_shape:
  - 33
  - 25
era5:
  pressure_levels_dir: ERA5/pressure_levels
  single_levels_dir: ERA5/single_levels
  pressure_levels_hpa:
  - 1000
  - 850
  - 700
  - 500
  - 300
  - 250
  pressure_vars:
  - u
  - v
  - z
  - q
  - t
  single_vars_instant:
  - u10
  - v10
  - d2m
  - t2m
  - sp
  - cape
  - cin
  - tcwv
  single_vars_accum:
  - tp
  season_months:
  - 5
  - 6
  - 7
  - 8
  - 9
  - 10
  years:
  - 2021
  - 2022
  - 2023
  - 2024
dem:
  srtm_dir: DEM/SRTM
  target_resolution_deg: 0.25
insat:
  hem_dir: INSAT/HEM
  uth_dir: INSAT/UTH
  ctp_dir: INSAT/CTP
  cmk_dir: INSAT/CMK
  use_for_training: false
boundaries:
  west_bengal_geojson: BOUNDARIES/west_bengal.geojson
  west_bengal_districts_geojson: BOUNDARIES/west_bengal_districts.geojson
  north_24_parganas_geojson: BOUNDARIES/north_24_parganas.geojson
labels:
  heavy_rain_3h_mm: 15.0
  extreme_rain_3h_mm: 30.0
  cape_severe_jkg: 2000.0
  cin_weak_jkg: 50.0
  rolling_window_hours: 3
sequence:
  input_hours: 6
  lead_times_hours:
  - 8
  - 10
  - 12
  - 14
  - 16
  stride_hours: 1
split:
  train_years:
  - 2021
  - 2022
  val_year: 2023
  test_year: 2024
  buffer_hours: 6
normalization:
  method: zscore
  stats_file: processed/cache/norm_stats.json
  fit_on: train
dataloader:
  batch_size: 32
  num_workers: 0
  pin_memory: true
training:
  epochs: 60
  lr: 0.0003
  weight_decay: 0.0001
  optimizer: adamw
  scheduler: cosine
  warmup_epochs: 3
  early_stopping_patience: 10
  grad_clip_norm: 1.0
  mixed_precision: true
  checkpoint_dir: outputs/checkpoints_v3
  log_dir: outputs/logs_v3
  resume: true
evaluation:
  metrics:
  - precision
  - recall
  - f1
  - roc_auc
  - pr_auc
  - pod
  - far
  - csi
  - mae
  - rmse
  per_lead_time: true
